[workspace]
resolver = "2"
members = [
    "crates/phantom-common",
    "crates/phantom-core",
    "crates/phantom-input",
    "crates/phantom-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Phantom contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "1"
tracing-subscriber = "0.3"
gtk4 = "0.9"
libadwaita = "0.7"
glib = "0.20"